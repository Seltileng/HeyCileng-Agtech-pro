{#
    Light/dark switch. The moon shows in light mode (switch to dark), the sun
    in dark mode (switch to light). script.js saves the choice in
    localStorage, and base.html applies it before the page is drawn.
    Set show_label to show the words beside the icon (used in the sidebar).
#}
<button class="theme-toggle {% if show_label %}theme-toggle-labelled{% endif %}" type="button" data-theme-toggle aria-label="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    {% if show_label %}
        <span class="label-dark">Dark mode</span>
        <span class="label-light">Light mode</span>
    {% endif %}
</button>
