{# Delete button for one listing. script.js asks the seller to confirm first. #}
<form method="post" action="{{ url_for('delete_listing', listing_id=listing.id) }}" data-confirm="Delete this listing? This cannot be undone.">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="button button-small button-danger" type="submit">Delete</button>
</form>
